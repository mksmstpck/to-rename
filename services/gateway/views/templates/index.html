<!DOCTYPE html>
<html>
<head>
    <title>{{.Name}}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="bg-gray-900 h-screen relative">
        <!-- navbar -->
        <nav class="bg-gray-800 p-4 absolute w-screen">
            <div class="container mx-auto flex justify-between items-center">
                <div class="bg-gray-900 rounded-lg hover:bg-blue-800">
                    <a href="#" class="text-white text-2xl font-bold p-3">MovieGarden</a>
                </div>
                <div class="hidden md:flex space-x-4">
                    <a href="#" class="text-gray-300 underline hover:underline-offset-4">Фільми</a>
                    <a href="#" class="text-gray-300 underline hover:underline-offset-4">Серіали</a>
                    <a href="#" class="text-gray-300 underline hover:underline-offset-4">Мультфільми</a>
                    <a href="#" class="text-gray-300 underline hover:underline-offset-4">Мультсеріали</a>
                </div>
                <div class="hidden md:flex">
                    <a href="#" class="text-gray-300 underline hover:underline-offset-4">log in</a>
                </div>
                <div class="md:hidden flex items-center">
                    <button class="text-gray-300 focus:outline-none" onclick="toggleMenu()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="md:hidden" id="mobile-menu">
                <a href="#" class="block px-2 py-1 text-gray-300 underline hover:underline-offset-4">Фільми</a>
                <a href="#" class="block px-2 py-1 text-gray-300 underline hover:underline-offset-4">Серіали</a>
                <a href="#" class="block px-2 py-1 text-gray-300 underline hover:underline-offset-4">Мультфільми</a>
                <a href="#" class="block px-2 py-1 text-gray-300 underline hover:underline-offset-4">Мультсеріали</a>
            </div>
        </nav>
        <div class="h-screen flex items-center">
            <div class="mx-auto">
                <h3 class="text-gray-50 text-xl ont-bold py-1">Що бажаєте переглянути?</h3>
                <div class="flex items-center rounded-2xl space-x-2">
                    <input type="text" placeholder="Введіть назву фільму" class="px-4 py-2 border rounded-full outline-none">
                    <button class="bg-blue-500 text-white p-2 rounded-full hover:bg-blue-600">
                        <svg class="w-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" transform="rotate(0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M14.9536 14.9458L21 21M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
